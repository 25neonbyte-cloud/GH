services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://hospital:hospital@postgres:5432/hospital?schema=public
      FRONTEND_URL: http://localhost:8080,http://localhost:5173
    volumes:
      - backup_data:/app/backups
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backup_data:
